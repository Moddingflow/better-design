/* ── Tokens (DESIGN.md) ─────────────────────────────────────────────────────────────── */
:root {
  --c-paper: #EEF0E9; --c-sheet: #FAFBF7; --c-sunk: #E3E6DD;
  --c-ink: #1B201D; --c-ink-2: #535A54;

  --c-focus: #0B4C66;

  --c-ochre: #7E5600; --c-ochre-wash: #F3E8C8;
  --c-park: #2C6639;

  --f-cond: "Fira Sans Condensed", "Fira Sans", "Arial Narrow", sans-serif;
  --f-text: "Fira Sans", system-ui, sans-serif;
  --t-h1: 600 22px/28px var(--f-cond);
  --t-h2: 600 17px/22px var(--f-cond);
  --t-fig: 600 17px/22px var(--f-cond);
  --t-body: 400 14px/20px var(--f-text);
  --t-strong: 500 14px/20px var(--f-text);
  --t-label: 500 13px/16px var(--f-text);
  --t-caption: 400 12px/16px var(--f-text);

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --r-control: 4px; --r-panel: 6px; --r-overlay: 8px;
  --h-sm: 30px; --h-md: 36px;
  --side-w: 216px; --rail-w: 360px;
  --shadow-overlay: 0 8px 24px rgb(27 32 29 / 0.16), 0 1px 3px rgb(27 32 29 / 0.12);

  --m-micro: 140ms; --m-small: 200ms; --m-medium: 280ms; --m-trace: 420ms;
  --e-standard: cubic-bezier(0.2, 0, 0, 1); --e-enter: cubic-bezier(0, 0, 0, 1); --e-exit: cubic-bezier(0.3, 0, 1, 1);

  /* interaction kit mapping */
  --ui-focus-ring: var(--c-focus);
  --ui-highlight: rgb(255 255 255 / 0.24);
  --ui-highlight-on-light: rgb(17 105 138 / 0.14);
  --ui-seg-track: var(--c-sunk);
  --ui-seg-indicator: var(--c-sheet);
}

/* ── Interaction kit (better-design assets/motion/interaction-kit.css, used parts) ───── */

  background: radial-gradient(circle at var(--ui-px, 50%) var(--ui-py, 50%), var(--ui-bloom, var(--ui-highlight-on-light)) 0%, transparent var(--ui-bloom-r, 70%)); opacity: 0; transition: opacity 600ms var(--ui-ease-out); }

  transition: opacity var(--ui-hover) var(--ui-ease-color), transform var(--ui-release) var(--ui-spring-pop), outline-offset var(--ui-focus) var(--ui-ease-out), outline-color var(--ui-focus) var(--ui-ease-out); }

  transform: translateX(var(--ui-seg-x, 0)); width: var(--ui-seg-w, 0); transition: transform 460ms var(--ui-spring-snap), width 460ms var(--ui-spring-snap); }

  .ui-segmented > button:hover:not([aria-selected="true"]):active { opacity: 0.55; }
}
.ui-btn-state { display: inline-grid; place-items: center; }

.ui-btn-state[data-state="pending"] > .ui-state-pending, .ui-btn-state[data-state="done"] > .ui-state-done { opacity: 1; transform: none; }
.ui-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: ui-spin 700ms linear infinite; }

.ui-field:focus-visible, .ui-field:focus { outline: none; border-color: var(--ui-focus-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ui-focus-ring) 30%, transparent); }

.ui-shake { animation: ui-shake 320ms var(--ui-ease-out); }
.ui-pop-in { transform-origin: var(--ui-origin, top center); transition: opacity 200ms var(--ui-ease-out), transform 260ms var(--ui-spring-snap), overlay 200ms allow-discrete, display 200ms allow-discrete; }
.ui-pop-in:not(:popover-open):not([open]) { opacity: 0; transform: scale(0.96) translateY(-4px); transition-duration: 140ms; }

@starting-style { dialog.ui-pop-in[open]::backdrop { background: rgb(27 32 29 / 0); } }

/* ── Base ───────────────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: var(--s-4); }
body { margin: 0; background: var(--c-paper); color: var(--c-ink); font: var(--t-body); font-synthesis: none; -webkit-font-smoothing: antialiased; }
::selection { background: var(--c-water-wash); color: var(--c-ink); }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--c-water); }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── Buttons ────────────────────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: var(--h-md); padding: 0 14px; border-radius: var(--r-control);
  border: 1px solid var(--c-line-strong); background: var(--c-sheet); color: var(--c-ink); font: var(--t-label); white-space: nowrap; cursor: pointer; text-decoration: none; }
.btn--sm { height: var(--h-sm); padding: 0 10px; }
.btn--primary { background: var(--c-water); border-color: var(--c-water); color: var(--c-on-water); }
.btn--quiet { border-color: transparent; background: transparent; color: var(--c-water); }
.btn--icon { width: var(--h-md); padding: 0; }
@media (hover: hover) and (pointer: fine) {
  .btn--secondary:hover { border-color: var(--c-ink-2); }
  .btn--quiet:hover { background: var(--c-water-wash); }
}

/* ── App shell ──────────────────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--s-5); padding: var(--s-5) var(--s-4); border-right: 1px solid var(--c-line); background: var(--c-sheet); }
.mark { display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-2); font: var(--t-h2); color: var(--c-ink); }
.mark svg { width: 22px; height: 22px; flex: none; }
.nav { display: grid; gap: var(--s-1); }
.nav a { display: flex; align-items: center; gap: var(--s-3); height: var(--h-md); padding: 0 var(--s-2); border-radius: var(--r-control); color: var(--c-ink-2); text-decoration: none; font: var(--t-label); }
.nav a .icon { width: 18px; height: 18px; }
.nav a[aria-current="page"] { background: var(--c-water-wash); color: var(--c-ink); }
.nav a[aria-current="page"] .icon { color: var(--c-water); }
.nav .count { margin-left: auto; font: var(--t-caption); font-variant-numeric: tabular-nums; color: var(--c-road); font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .nav a:not([aria-current]):hover { background: var(--c-paper); color: var(--c-ink); } }

.work { min-width: 0; padding: var(--s-5); display: grid; gap: var(--s-4); align-content: start; max-width: 1680px; width: 100%; }

/* Header */
.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 420px) auto; grid-template-areas: "title search act"; align-items: center; gap: var(--s-4); }
.top__title { grid-area: title; display: grid; gap: 2px; min-width: 0; }
.top h1 { font: var(--t-h1); }
.status-line { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--s-3); row-gap: 0; font: var(--t-caption); color: var(--c-ink-2); }
.status-line .demo { color: var(--c-ochre); }
.search { grid-area: search; position: relative; justify-self: end; width: 100%; }
.search .icon { position: absolute; left: 12px; top: 10px; color: var(--c-ink-2); pointer-events: none; }
.field { width: 100%; height: var(--h-md); padding: 0 12px; border: 1px solid var(--c-line-strong); border-radius: var(--r-control); background: var(--c-sheet); font: var(--t-body); }
.search .field { padding-left: 36px; }
.field::placeholder { color: var(--c-ink-2); opacity: 1; }
.top__act { grid-area: act; display: flex; gap: var(--s-2); }

/* Workspace grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) var(--rail-w); gap: var(--s-4); align-items: start; }
.col { display: grid; gap: var(--s-4); min-width: 0; }

.panel { background: var(--c-sheet); border: 1px solid var(--c-line); border-radius: var(--r-panel); min-width: 0; }
.panel__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); min-height: 56px; padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--c-line); }
.panel__head h2 { font: var(--t-h2); display: flex; align-items: baseline; gap: var(--s-2); }
.panel__head h2 .n { font: var(--t-fig); font-variant-numeric: tabular-nums; color: var(--c-ink-2); }
.panel__head .tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); }
.panel__sub { font: var(--t-caption); color: var(--c-ink-2); }

/* Flash for changed values */
@keyframes wash { from { background-color: var(--c-water-wash); } to { background-color: transparent; } }
.flash { animation: wash 1200ms var(--e-standard); }

/* ── Problems ───────────────────────────────────────────────────────────────────────── */
.probs > li { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--m-medium) var(--e-standard), opacity var(--m-small) var(--e-exit); }
.probs > li.is-leaving { grid-template-rows: 0fr; opacity: 0; }
.probs > li > .prob { overflow: hidden; min-height: 0; }
.prob__in { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: var(--s-3); row-gap: var(--s-2); align-items: center; padding: var(--s-3) var(--s-4); border-top: 1px solid var(--c-line); }
.probs > li:first-child .prob__in { border-top: 0; }
.prob__icon { align-self: start; margin-top: 2px; }
.prob[data-sev="high"] .prob__icon, .prob[data-sev="high"] .prob__title { color: var(--c-road); }
.prob[data-sev="mid"] .prob__icon, .prob[data-sev="mid"] .prob__title { color: var(--c-ochre); }
.prob__title { font: var(--t-strong); }
.prob__meta { display: flex; flex-wrap: wrap; column-gap: var(--s-3); font: var(--t-caption); color: var(--c-ink-2); }
.prob__meta b { font-weight: 500; color: var(--c-ink); }
.prob__act { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s-2); }
.empty { padding: var(--s-5) var(--s-4); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); color: var(--c-ink-2); }
.empty .icon { color: var(--c-park); }

/* ── Orders ─────────────────────────────────────────────────────────────────────────── */
.seg button { height: 24px; padding: 0 10px; font: var(--t-label); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg .c { font-variant-numeric: tabular-nums; color: var(--c-ink-2); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: var(--s-1); height: var(--h-sm); padding: 0 var(--s-1) 0 10px; border-radius: var(--r-control); background: var(--c-water-wash); color: var(--c-ink); font: var(--t-label); }
.chip button { width: 24px; height: 24px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-control); background: transparent; cursor: pointer; padding: 0; color: var(--c-ink-2); }
.tablewrap { overflow-x: auto; }
table.orders { width: 100%; border-collapse: collapse; font: var(--t-body); }
.orders th { text-align: left; font: var(--t-caption); color: var(--c-ink-2); font-weight: 500; padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--c-line); white-space: nowrap; }
.orders td { padding: 10px var(--s-4); border-bottom: 1px solid var(--c-line); vertical-align: middle; }
.orders tbody tr:last-child td { border-bottom: 0; }
.orders tbody tr { transition: background-color var(--m-micro) var(--e-standard); }
@media (hover: hover) and (pointer: fine) { .orders tbody tr[data-id]:hover { background: color-mix(in srgb, var(--c-paper) 60%, transparent); } }
.orders .th-due, .orders .o-due { text-align: right; }
.o-id { font: var(--t-strong); font-variant-numeric: tabular-nums; white-space: nowrap; width: 1%; }
.o-st { white-space: nowrap; width: 1%; }
.st { display: inline-flex; align-items: center; gap: 6px; }
.st--new { color: var(--c-ochre); }
.st--route { color: var(--c-water); }
.st--done { color: var(--c-park); }
.st--pack { color: var(--c-ink); }
.st span { color: var(--c-ink); }
.o-addr { min-width: 180px; }
.o-addr .zone { display: block; font: var(--t-caption); color: var(--c-ink-2); }
.o-cour { white-space: nowrap; width: 1%; }
.o-cour .none { color: var(--c-ink-2); }
.o-due { white-space: nowrap; width: 1%; }
.due { display: grid; justify-items: end; }
.due .t { font: var(--t-fig); font-variant-numeric: tabular-nums; }
.due .rel { font: var(--t-caption); color: var(--c-ink-2); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: var(--s-1); }
.due.is-late .t, .due.is-late .rel { color: var(--c-road); }
.due.is-late .rel { font-weight: 500; }
.due .rel .icon { width: 12px; height: 12px; }
tr.is-new { animation: wash 1600ms var(--e-standard); }
.tbl-note { padding: var(--s-5) var(--s-4); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3); color: var(--c-ink-2); }
.err { color: var(--c-road); display: flex; align-items: center; gap: var(--s-2); }

/* ── Skeletons ──────────────────────────────────────────────────────────────────────── */
.sk { display: block; height: 12px; border-radius: var(--r-control); background: var(--c-sunk); }
.sk-row { display: grid; grid-template-columns: 16px 1fr 160px; gap: var(--s-3); align-items: center; padding: var(--s-4); border-top: 1px solid var(--c-line); }
.sk-row:first-child { border-top: 0; }
.sk-stack { display: grid; gap: var(--s-2); }
@keyframes sk-breathe { 50% { opacity: 0.55; } }
[aria-busy="true"] .sk { animation: sk-breathe 1600ms ease-in-out infinite; }
.region { transition: opacity var(--m-small) var(--e-enter); }
.region.is-entering { opacity: 0; }

/* ── Map (signature) ────────────────────────────────────────────────────────────────── */
.map { position: relative; margin: var(--s-4); aspect-ratio: 340 / 220; }
.map svg.city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.zone-shape { fill: var(--c-paper); stroke: var(--c-sheet); stroke-width: 3; stroke-linejoin: round; transition: fill var(--m-small) var(--e-standard); }
.zone-shape.is-sel { fill: var(--c-water-wash); }
.contour { fill: none; stroke: var(--c-line); stroke-width: 0.75; }
.river { fill: none; stroke: var(--c-water-wash); stroke-width: 11; stroke-linecap: round; }
.river-edge { fill: none; stroke: var(--c-water); stroke-width: 1; opacity: 0.55; }
.trace { fill: none; stroke: var(--c-water); stroke-width: 2.25; stroke-linejoin: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset var(--m-small) var(--e-exit); }
.trace.is-on { stroke-dashoffset: 0; transition: stroke-dashoffset var(--m-trace) var(--e-standard); }
.zbtn { position: absolute; translate: -50% -50%; display: grid; justify-items: center; gap: 0; min-width: 56px; padding: 2px var(--s-2) 4px; border: 0; border-radius: var(--r-control); background: transparent; cursor: pointer; color: var(--c-ink); }

/* ── Couriers ───────────────────────────────────────────────────────────────────────── */
.cour > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s-3); padding: 10px var(--s-4); border-top: 1px solid var(--c-line); min-height: 56px; }

dialog.dlg { width: min(440px, calc(100vw - 2 * var(--s-4))); padding: 0; border: 1px solid var(--c-line); border-radius: var(--r-overlay); background: var(--c-sheet); color: var(--c-ink); box-shadow: var(--shadow-overlay); }

.toasts { position: fixed; right: var(--s-5); bottom: var(--s-5); display: grid; gap: var(--s-2); z-index: 20; max-width: calc(100vw - 2 * var(--s-4)); }

  const row = `<div class="sk-row" aria-hidden="true"><span class="sk"></span><span class="sk-stack"><span class="sk" style="width:46%"></span><span class="sk" style="width:72%"></span></span><span class="sk"></span></div>`;
  $('#probRegion').innerHTML = row.repeat(3);
  $('#ordRegion').innerHTML = row.repeat(6);
  $('#courRegion').innerHTML = row.repeat(5);
}
function setBusy(b) { ['#probRegion', '#ordRegion', '#courRegion'].forEach(s => $(s).setAttribute('aria-busy', String(b))); }
function load() {
  skeletons(); setBusy(true);
  return fetchShift().then(data => {
    S = data; buildMap();
    ['#probRegion', '#ordRegion', '#courRegion'].forEach(s => $(s).classList.add('is-entering'));
    renderAll(); setBusy(false);
    $('#updated').textContent = hhmm(Date.now());
    requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.region.is-entering').forEach(r => r.classList.remove('is-entering'))));
  }, err => {
    setBusy(false);
    const box = `<div class="tbl-note"><span class="err">${icon('alert')}Не удалось загрузить данные смены: ${esc(err.message)}.</span><button type="button" class="btn btn--secondary btn--sm ui-press ui-focus" data-act="retry">Повторить</button></div>`;
    $('#probRegion').innerHTML = box; $('#ordRegion').innerHTML = ''; $('#courRegion').innerHTML = '';
  });
}

/* ── Undo & toasts ──────────────────────────────────────────────────────────────────── */
let snapshot = null;
function remember() { snapshot = JSON.stringify(S); }
function toast(text, undoable) {
  const host = $('#toasts');
  host.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon('check')}<span>${text}</span>${undoable ? `<button type="button" class="btn btn--quiet btn--sm ui-press ui-press--on-dark ui-focus" data-act="undo">Отменить</button>` : ''}`;
  host.appendChild(el);
  let timer, left = 6000, started = Date.now();
  const hide = () => { el.classList.add('is-hidden'); setTimeout(() => el.remove(), 200); };
  const arm = () => { started = Date.now(); timer = setTimeout(hide, left); };
  const pause = () => { clearTimeout(timer); left = Math.max(1500, left - (Date.now() - started)); };
  el.addEventListener('pointerenter', pause); el.addEventListener('pointerleave', arm);
  el.addEventListener('focusin', pause); el.addEventListener('focusout', arm);
  arm();
}
function resolveProblem(pid, after) {
  const li = $(`#probRegion li[data-pid="${pid}"]`);
  const done = () => { S.problems = S.problems.filter(p => p.id !== pid); after && after(); renderAll(); };
  if (!li || matchMedia('(prefers-reduced-motion: reduce)').matches) { done(); return; }
  li.classList.add('is-leaving');
  setTimeout(done, 280);
}

/* ── Assign popover ─────────────────────────────────────────────────────────────────── */
const pick = $('#pick');
function openPick(trigger, title, zone, exclude, onPick) {
  const cands = S.couriers.filter(c => c.id !== exclude && (c.s === 'free' || (c.s === 'route' && ordersOf(c.id).length < 2)))
    .sort((a, b) => (b.zone === zone) - (a.zone === zone) || (a.s === 'free' ? -1 : 1) - (b.s === 'free' ? -1 : 1));
  pick.innerHTML = `<h3 id="pickH">${title}</h3><ul>${cands.map(c => {
    const held = ordersOf(c.id).length;
    return `<li><button type="button" class="ui-press ui-press--surface ui-focus" data-cid="${c.id}"><span><span class="pn">${esc(c.name)}</span><br><span class="pz">${zoneName(c.zone)}${c.zone === zone ? ', та же зона' : ''}</span></span><span class="pl">${c.s === 'free' ? 'свободен' : `${held} ${plural(held, 'заказ', 'заказа', 'заказов')}`}</span></button></li>`;
  }).join('')}</ul>`;
  pick._onPick = onPick; pick._trigger = trigger;
  pick.showPopover();
  const t = trigger.getBoundingClientRect(), w = pick.offsetWidth, h = pick.offsetHeight;
  let left = Math.min(Math.max(16, t.right - w), innerWidth - w - 16);
  let top = t.bottom + 6; if (top + h > innerHeight - 16) top = Math.max(16, t.top - h - 6);
  pick.style.left = left + 'px'; pick.style.top = top + 'px';
  BetterUI.originFrom(pick, trigger);
  const first = pick.querySelector('button'); first && first.focus();
}
pick.addEventListener('click', e => {
  const b = e.target.closest('button[data-cid]'); if (!b) return;
  const fn = pick._onPick; pick.hidePopover(); fn && fn(b.dataset.cid);
});
pick.addEventListener('toggle', e => { if (e.newState === 'closed' && pick._trigger && document.contains(pick._trigger) && pick.contains(document.activeElement) === false && document.activeElement === document.body) pick._trigger.focus(); });

function assignFor(pid, trigger) {
  const p = S.problems.find(x => x.id === pid);
  if (p.kind === 'lost') {
    const c = courier(p.courier), held = ordersOf(c.id);
    openPick(trigger, `Передать ${held.length} ${plural(held.length, 'заказ', 'заказа', 'заказов')} от ${c.name}`, c.zone, c.id, cid => {
      remember();
      resolveProblem(pid, () => { held.forEach(o => { order(o.id).cour = cid; }); });
      toast(`Заказы ${held.map(o => o.id).join(', ')} переданы: ${courier(cid).name}`, true);
    });
    return;
  }
  const o = order(p.order);
  openPick(trigger, `${o.cour ? 'Переназначить' : 'Назначить'} заказ ${o.id}`, o.zone, o.cour, cid => {
    remember();
    resolveProblem(pid, () => { const x = order(o.id); x.cour = cid; if (x.st === 'new') x.st = 'pack'; });
    toast(`Заказ ${o.id}: ${courier(cid).name}`, true);
  });
}

/* ── Events ─────────────────────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'assign') assignFor(b.dataset.p, b);
  else if (act === 'assign-order') {
    const o = order(+b.dataset.o);
    openPick(b, `Назначить заказ ${o.id}`, o.zone, null, cid => {
      remember();
      const pr = S.problems.find(p => p.kind === 'unassigned' && p.order === o.id);
      const apply = () => { const x = order(o.id); x.cour = cid; if (x.st === 'new') x.st = 'pack'; };
      if (pr) resolveProblem(pr.id, apply); else { apply(); renderAll(); }
      toast(`Заказ ${o.id}: ${courier(cid).name}`, true);
    });
  }
  else if (act === 'extend') {
    const p = S.problems.find(x => x.id === b.dataset.p); remember();
    const nd = order(p.order).due + 15 * MIN;
    resolveProblem(p.id, () => { order(p.order).due = nd; });
    toast(`Срок заказа ${p.order} продлён до ${hhmm(nd)}`, true);
  }
  else if (act === 'resolve') { const p = S.problems.find(x => x.id === b.dataset.p); remember(); resolveProblem(p.id); toast(`Проблема по заказу ${p.order} закрыта`, true); }
  else if (act === 'undo') { if (snapshot) { S = JSON.parse(snapshot); snapshot = null; renderAll(); } b.closest('.toast').remove(); toast('Действие отменено', false); }
  else if (act === 'zone') { ui.zone = ui.zone === b.dataset.z ? null : b.dataset.z; renderOrders(); renderMap(); }
  else if (act === 'clearzone') { ui.zone = null; renderOrders(); renderMap(); }
  else if (act === 'clearq') { ui.q = ''; $('#q').value = ''; renderOrders(); $('#q').focus(); }
  else if (act === 'retry') load();
});

// Signature: hovering or focusing an order traces its zone on the map.
const ordRegion = $('#ordRegion');
ordRegion.addEventListener('pointerover', e => { const tr = e.target.closest('tr[data-zone]'); trace(tr ? tr.dataset.zone : null); });
ordRegion.addEventListener('pointerleave', () => trace(null));
ordRegion.addEventListener('focusin', e => { const tr = e.target.closest('tr[data-zone]'); trace(tr ? tr.dataset.zone : null); });
ordRegion.addEventListener('focusout', () => trace(null));
$('#probRegion').addEventListener('pointerover', e => {
  const li = e.target.closest('li[data-pid]'); if (!li || !S) { trace(null); return; }
  const p = S.problems.find(x => x.id === li.dataset.pid); trace(p ? (p.order ? order(p.order).zone : courier(p.courier).zone) : null);
});
$('#probRegion').addEventListener('pointerleave', () => trace(null));

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { ui.q = e.target.value.trim(); if (S) renderOrders(); }, 120); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.value) { e.target.value = ''; ui.q = ''; renderOrders(); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });

$('#refresh').addEventListener('click', e => {
  const btn = e.currentTarget;
  BetterUI.runWithState(btn, () => new Promise(res => setTimeout(res, 450))).then(() => { $('#updated').textContent = hhmm(Date.now()); if (S) renderAll(); const u = $('#updated'); u.classList.remove('flash'); void u.offsetWidth; u.classList.add('flash'); });
});

// New order dialog
const dlg = $('#dlg');
$('#newOrder').addEventListener('click', () => {
  if (!S) return;
  $('#fZone').innerHTML = S.zones.map(z => `<option value="${z.id}">${z.name}</option>`).join('');
  if (ui.zone) $('#fZone').value = ui.zone;
  $('#fAddr').value = ''; $('#fAddr').removeAttribute('aria-invalid'); $('#fAddrMsg').hidden = true;
  dlg.showModal(); $('#fAddr').focus();
});
$('#dlgCancel').addEventListener('click', () => dlg.close());
$('#fAddr').addEventListener('input', () => { if ($('#fAddr').value.trim()) { $('#fAddr').removeAttribute('aria-invalid'); $('#fAddrMsg').hidden = true; } });
$('#orderForm').addEventListener('submit', e => {
  e.preventDefault();
  const addr = $('#fAddr').value.trim();
  if (addr.length < 3) { $('#fAddr').setAttribute('aria-invalid', 'true'); $('#fAddrMsg').hidden = false; BetterUI.shake($('#fAddr')); $('#fAddr').focus(); return; }
  const btn = $('#dlgSubmit');
  BetterUI.runWithState(btn, () => new Promise(res => setTimeout(res, 450)), { doneMs: 500 }).then(() => {
    remember();
    const id = Math.max(...S.orders.map(o => o.id)) + 1;
    S.orders.push({ id, st: 'new', addr, zone: $('#fZone').value, cour: null, due: Date.now() + (+$('#fDue').value) * MIN });
    setTimeout(() => {
      dlg.close();
      if (!['active', 'new'].includes(ui.tab)) tabsCtl.select($('#tabs [data-f="new"]'));
      if (ui.zone && ui.zone !== $('#fZone').value) ui.zone = null;
      renderAll(id); toast(`Заказ ${id} создан`, true);
    }, 350);
  });
});

// Tabs
let tabsCtl = null;
tabsCtl = BetterUI.segmented($('#tabs'), { onChange: b => { ui.tab = b.dataset.f; if (S) renderOrders(); } });

// Live clock: due captions and "не на связи" minutes follow the time without re-rendering controls.
setInterval(() => {
  if (!S) return;
  document.querySelectorAll('#ordRegion tr[data-id]').forEach(tr => { const o = order(+tr.dataset.id); if (o) tr.querySelector('[data-due]').innerHTML = dueHTML(o); });
}, 30000);

BetterUI.init(document);
load();
</script>
</body>
</html>
