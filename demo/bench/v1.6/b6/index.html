  --ease-standard: cubic-bezier(0.28, 0.11, 0.32, 1);

  /* interaction kit mapping */

.ui-pop-in:popover-open, .ui-pop-in[open] { opacity: 1; transform: none; }

/* ── Base ───────────────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--color-canvas); }
body { margin: 0; background: var(--color-canvas); color: var(--color-text); font: var(--type-body);
  font-variation-settings: "CRSV" 0, "SHRP" 0, "slnt" 0; -webkit-font-smoothing: antialiased; }

ul { list-style: none; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.icon { width: var(--size-icon); height: var(--size-icon); flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.t-danger { color: var(--color-danger); }
.t-warning { color: var(--color-warning); }
.t-success { color: var(--color-success); }
.t-muted { color: var(--color-text-secondary); }

/* ── Buttons ────────────────────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8); border: 1px solid transparent; border-radius: var(--radius-pill);
  cursor: pointer; white-space: nowrap; text-decoration: none; background-color: transparent; }
.btn--sm { height: var(--size-btn-sm); padding: 0 var(--space-12); font: var(--type-small); }
.btn--md { height: var(--size-btn-md); padding: 0 var(--space-20); font: var(--type-body); }
.btn--primary { background-color: var(--color-action); color: var(--color-on-action); }
.btn--ghost { border-color: var(--color-field-border); color: var(--color-text); }
.btn--quiet { color: var(--color-text-secondary); }
@media (hover: hover) and (pointer: fine) {
  .btn--ghost:hover, .btn--quiet:hover { background-color: var(--color-surface-raised); color: var(--color-text); }
}
@media (pointer: coarse) { .btn--sm { height: var(--size-btn-md); } }

/* ── Top bar ────────────────────────────────────────────────────────────────────────── */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--color-glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--color-hairline); }
.topbar__in { max-width: 1440px; margin: 0 auto; min-height: var(--size-topbar); padding: var(--space-8) var(--space-32);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-24); }
.brand { display: flex; align-items: baseline; gap: var(--space-12); min-width: 0; }
.brand h1 { font: var(--type-headline); white-space: nowrap; }
.brand p { font: var(--type-small); color: var(--color-text-secondary); white-space: nowrap; }
.search { position: relative; justify-self: center; width: min(100%, 420px); }
.search .icon { position: absolute; left: var(--space-12); top: 50%; translate: 0 -50%; color: var(--color-text-secondary); pointer-events: none; }
.search input { width: 100%; height: var(--size-field-sm); padding: 0 var(--space-12) 0 var(--space-40); background: var(--color-surface-raised); border: 1px solid var(--color-field-border);
  border-radius: var(--radius-field); }
.search input::placeholder { color: var(--color-text-secondary); }
.search input::-webkit-search-cancel-button { filter: invert(1) brightness(0.7); }
.meta { display: flex; align-items: center; gap: var(--space-12); }
.clock { font: var(--type-headline); font-variant-numeric: tabular-nums; }
.fixture { font: var(--type-caption); color: var(--color-text-secondary); border: 1px solid var(--color-hairline); border-radius: var(--radius-pill); padding: var(--space-4) var(--space-8); white-space: nowrap; }

/* ── Page layout ────────────────────────────────────────────────────────────────────── */
.page { max-width: 1440px; margin: 0 auto; padding: var(--space-24) var(--space-32) var(--space-64);
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "summary summary" "main side"; gap: var(--space-24); align-items: start; }
.summary { grid-area: summary; }
.main { grid-area: main; display: grid; gap: var(--space-24); min-width: 0; }
.side { grid-area: side; position: sticky; top: calc(var(--size-topbar) + var(--space-24)); min-width: 0; }

/* ── Summary strip ──────────────────────────────────────────────────────────────────── */
/* Columns follow the page grid: the courier stat sits exactly over the courier panel. */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 360px; column-gap: var(--space-24); background: var(--color-surface); border-radius: var(--radius-card); }
.stat { display: grid; gap: var(--space-12); align-content: center; justify-items: start; text-align: left; border: 0; background-color: transparent; border-radius: var(--radius-card);
  padding: var(--space-20) var(--space-24); cursor: pointer; }
.stat__value { font: var(--type-stat); letter-spacing: -0.02em; display: flex; align-items: baseline; gap: var(--space-8); }
/* Ink centering: trim line boxes to cap height so the two-line block centers by its visible text.
   Every label row is icon-high, so values line up across the strip whether or not a label has an icon. */
.stat__value > span, .stat__label > span { text-box: trim-both cap alphabetic; }
.stat__label { min-height: var(--size-icon-sm); }
.stat__value .of { font: var(--type-body); color: var(--color-text-secondary); letter-spacing: 0; }
.stat__label { font: var(--type-small); color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--space-8); }
.stat[aria-pressed="true"] { background-color: var(--color-surface-raised); }
@media (hover: hover) and (pointer: fine) { .stat:hover { background-color: var(--color-surface-raised); } }

/* ── Regions ────────────────────────────────────────────────────────────────────────── */
.region { background: var(--color-surface); border-radius: var(--radius-card); padding: var(--space-24); min-width: 0; }
.region__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-16); flex-wrap: wrap; margin-bottom: var(--space-12); }
.region__title { display: flex; align-items: center; gap: var(--space-12); }
.region__title h2 { font: var(--type-title); letter-spacing: -0.015em; }
.count { font: var(--type-caption); color: var(--color-text-secondary); background: var(--color-surface-raised); border-radius: var(--radius-pill); padding: var(--space-4) var(--space-8); font-variant-numeric: tabular-nums; }
.region__tools { display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap; }
.region .ui-segmented { font: var(--type-small); }
.region .ui-segmented > button { padding: 6px var(--space-12); white-space: nowrap; }
.region__tools { max-width: 100%; }
.region__tools .ui-segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; }

/* ── Problems ───────────────────────────────────────────────────────────────────────── */
.problems li { display: grid; grid-template-columns: var(--size-icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-12);
  padding: var(--space-12) 0; border-top: 1px solid var(--color-hairline); overflow: hidden; }
.problem__text { min-width: 0; }
.problem__title { font: var(--type-body-strong); }
.problem__meta { font: var(--type-small); color: var(--color-text-secondary); margin-top: var(--space-4); }
.problem__actions { display: flex; gap: var(--space-8); align-items: center; }
.problem--danger > .icon { color: var(--color-danger); }
.problem--warning > .icon { color: var(--color-warning); }
.empty { display: flex; align-items: center; gap: var(--space-12); padding: var(--space-16) 0; border-top: 1px solid var(--color-hairline); color: var(--color-text-secondary); }
.empty .icon { color: var(--color-success); }

/* ── Orders table ───────────────────────────────────────────────────────────────────── */
.chip-filter { display: inline-flex; align-items: center; gap: var(--space-4); }
.orders table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.orders th { font: var(--type-small); color: var(--color-text-secondary); text-align: left; padding: var(--space-8) var(--space-12) var(--space-8) 0; }
.orders th:last-child, .orders td:last-child { text-align: right; padding-right: 0; }
.orders td { padding: var(--space-12) var(--space-12) var(--space-12) 0; border-top: 1px solid var(--color-hairline); vertical-align: middle; }
.orders col.c-id { width: 96px; } .orders col.c-courier { width: 23%; } .orders col.c-status { width: 20%; } .orders col.c-time { width: 168px; }
.cell-main { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-sub { display: block; font: var(--type-small); color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: var(--space-4); }
.status { display: inline-flex; align-items: center; gap: var(--space-8); font: var(--type-small); }
.status .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); }

.td-addr .cell-main, .td-addr .cell-sub { white-space: normal; overflow-wrap: anywhere; }
.time { display: inline-grid; justify-items: end; gap: var(--space-4); }
.time__val { display: inline-flex; align-items: center; gap: var(--space-8); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.time__val .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.roll { display: inline-block; }
.time__sub { font: var(--type-small); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: var(--space-8); }
/* Signature: the promise bar — elapsed share of the delivery window */
.bar { position: relative; width: 64px; height: 4px; border-radius: var(--radius-pill); background: var(--color-hairline); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: inherit; background: var(--color-text-secondary); transform-origin: left; transform: scaleX(var(--p, 0));
  transition: transform var(--motion-small) var(--ease-standard), background-color var(--motion-micro) var(--ease-standard); }

.orders tr:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.orders tr.is-flash td { animation: flash 1200ms var(--ease-standard); }
@keyframes flash { from { background-color: var(--color-tint-changed); } to { background-color: transparent; } }
.orders .empty-row td { text-align: left; color: var(--color-text-secondary); }
.empty-row .empty-in { display: flex; align-items: center; gap: var(--space-12); flex-wrap: wrap; }

/* ── Couriers ───────────────────────────────────────────────────────────────────────── */
.couriers li + li { border-top: 1px solid var(--color-hairline); }
.couriers ul { margin: 0 calc(var(--space-12) * -1); }
.courier { width: 100%; display: grid; grid-template-columns: var(--size-icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-12); text-align: left;
  padding: var(--space-12); border: 0; border-radius: var(--radius-field); background-color: transparent; cursor: pointer; }
.courier .icon { color: var(--color-text-secondary); }

.courier__name { display: block; }
.courier__meta { display: block; font: var(--type-small); color: var(--color-text-secondary); margin-top: var(--space-4); }
.courier__load { font: var(--type-small); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }

@media (hover: hover) and (pointer: fine) { .courier:hover { background-color: var(--color-surface-raised); } }

/* ── Skeleton & error ───────────────────────────────────────────────────────────────── */
.sk { display: block; height: 12px; border-radius: var(--radius-pill); background: var(--color-surface-raised); animation: sk 1600ms var(--ease-standard) infinite alternate; }
.sk-row { display: grid; grid-template-columns: var(--size-icon) 1fr 96px; gap: var(--space-12); align-items: center; padding: var(--space-16) 0; border-top: 1px solid var(--color-hairline); }
.sk-row .sk-dot { width: var(--size-icon); height: var(--size-icon); border-radius: 50%; background: var(--color-surface-raised); }
.sk-lines { display: grid; gap: var(--space-8); }
@keyframes sk { from { opacity: 1; } to { opacity: 0.45; } }
[aria-busy="true"] .live { display: none; }

.live { animation: in var(--motion-small) var(--ease-standard); }
@keyframes in { from { opacity: 0; } to { opacity: 1; } }
.error { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-12); flex-wrap: wrap; }
.count:empty { display: none; }
[hidden] { display: none !important; }
.error .icon { color: var(--color-danger); }

/* ── Dialog ─────────────────────────────────────────────────────────────────────────── */
dialog.assign { width: min(440px, calc(100vw - var(--space-32))); padding: var(--space-24); border: 0; border-radius: var(--radius-card); background: var(--color-surface-raised); color: var(--color-text); }

  const state = { orders: [], couriers: [], problems: [], filter: 0, cFilter: 0, courier: null, query: '', loaded: false };
  const ORDER_FILTERS = ['all', 'waiting', 'enroute', 'risk'];

  const left = o => (o.promiseAt - Date.now()) / MIN;
  const isLate = o => left(o) <= 0;
  const isRisk = o => left(o) <= 10;
  const order = id => state.orders.find(o => o.id === id);
  const courier = id => state.couriers.find(c => c.id === id);
  const ordersOf = c => state.orders.filter(o => o.courier === c.id);
  function courierState(c) {
    if (c.offlineSince) return 'off';
    if (c.breakUntil && c.breakUntil > Date.now()) return 'break';
    const n = ordersOf(c);
    if (!n.length) return 'free';
    return n.some(o => o.status === 'pickup') ? 'pickup' : 'enroute';
  }
  function timeText(o) {
    const l = left(o);
    if (l <= 0) return 'опоздание ' + Math.max(1, Math.ceil(-l)) + NB + 'мин';
    return 'через ' + Math.ceil(l) + NB + 'мин';
  }

  /* ── Rolling value: the board's minute flip ─────────────────────────────────────── */
  function roll(el, text) {
    if (el.textContent === text) return;
    const first = el.textContent === '' || el.textContent === '–' || el.textContent === '--:--';
    el.textContent = text;
    if (first || reduce.matches || !el.animate) return;
    el.animate([{ transform: 'translateY(45%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(0.28, 0.11, 0.32, 1)' });
  }

  /* ── Summary ───────────────────────────────────────────────────────────────────── */
  function renderSummary() {
    const active = state.orders.length;
    const waiting = state.orders.filter(o => !o.courier).length;
    const risk = state.orders.filter(isRisk).length;
    const online = state.couriers.filter(c => !['off', 'break'].includes(courierState(c))).length;
    const free = state.couriers.filter(c => courierState(c) === 'free').length;
    const set = (k, v) => roll($(`[data-num="${k}"]`), String(v));
    set('active', active); set('waiting', waiting); set('risk', risk); set('free', free); set('online', online);
    const f = ORDER_FILTERS[state.filter];
    document.querySelectorAll('.stat').forEach(b => {
      const k = b.dataset.stat;
      b.setAttribute('aria-pressed', String(k === 'free' ? state.cFilter === 1 : k === f));
    });
  }

  /* ── Problems ──────────────────────────────────────────────────────────────────── */
  function problemView(p) {
    const o = order(p.order), c = o && o.courier ? courier(o.courier) : null;
    const ago = Math.max(1, Math.round((Date.now() - p.raisedAt) / MIN));
    const street = o ? o.addr.split(',').slice(0, 2).join(',') : '';
    switch (p.kind) {
      case 'late': return { sev: 'danger', ic: 'alert', title: `№${NB}${o.id} — ${timeText(o)}`, meta: `${c ? c.short : 'Без курьера'} · ${street}`,
        actions: [['reassign', 'Переназначить', 'user-plus']] };
      case 'offline': { const cc = courier(p.courier); const mins = Math.max(1, Math.round((Date.now() - cc.offlineSince) / MIN));
        const mine = ordersOf(cc);
        return { sev: 'danger', ic: 'wifi-off', title: `${cc.short} не на связи ${mins}${NB}мин`,
          meta: mine.length ? `Везёт №${NB}${mine.map(x => x.id).join(', №' + NB)}` : 'Заказов на руках нет',
          actions: mine.length ? [['reassign', `Переназначить №${NB}${mine[0].id}`, 'user-plus', mine[0].id]] : [] }; }
      case 'client': return { sev: 'warning', ic: 'user-x', title: `Клиент №${NB}${o.id} не отвечает`, meta: `${c ? c.short : ''} у двери · ${street}`,
        actions: [['extend', 'Срок +15 мин', 'plus-time']] };
      case 'kitchen': return { sev: 'warning', ic: 'hourglass', title: `${o.from} задерживает №${NB}${o.id}`, meta: `Обещано к ${hhmm(o.promiseAt)} · ${street}`,
        actions: [['extend', 'Срок +15 мин', 'plus-time']] };
    }
    return null;
  }
  const SEV = { danger: 0, warning: 1 };
  function renderProblems(flashId) {
    const list = $('#problem-list');
    const items = state.problems.map(p => ({ p, v: problemView(p) })).filter(x => x.v)
      .sort((a, b) => SEV[a.v.sev] - SEV[b.v.sev] || a.p.raisedAt - b.p.raisedAt);
    $('[data-count="problems"]').textContent = items.length;
    if (!items.length) { list.innerHTML = `<li class="empty">${icon('check-circle')}<span>Открытых проблем нет</span></li>`; return; }
    list.innerHTML = items.map(({ p, v }) => `
      <li class="problem--${v.sev}" data-pid="${p.id}">
        ${icon(v.ic)}
        <div class="problem__text"><p class="problem__title">${esc(v.title)}</p><p class="problem__meta">${esc(v.meta)} · ${Math.max(1, Math.round((Date.now() - p.raisedAt) / MIN))}${NB}мин назад</p></div>
        <div class="problem__actions">
          ${v.actions.map(([act, label, ic, oid]) => `<button class="btn btn--sm btn--ghost ui-press ui-press--on-dark ui-focus" data-act="${act}" data-order="${oid || p.order}">${icon(ic, 'icon--sm')}<span>${esc(label)}</span></button>`).join('')}
          <button class="btn btn--sm btn--quiet ui-press ui-press--on-dark ui-focus" data-act="resolve" data-pid="${p.id}">${icon('check', 'icon--sm')}<span>Решено</span></button>
        </div>

      const li = list.querySelector(`[data-pid="${flashId}"]`);
      if (li && li.animate && !reduce.matches) li.animate([{ height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' }, { height: li.offsetHeight + 'px', opacity: 1 }], { duration: 280, easing: 'cubic-bezier(0.28, 0.11, 0.32, 1)' });
    }

  /* ── Orders ────────────────────────────────────────────────────────────────────── */
  const STATUS = {
    waiting: ['Ждёт курьера', 'user-plus', 't-warning'],
    pickup: ['Забирает', 'package', 't-muted'],
    enroute: ['В пути', 'bike', 't-muted']
  };
  function visibleOrders() {
    const f = ORDER_FILTERS[state.filter], q = state.query.trim().toLowerCase();
    return state.orders.filter(o => {
      if (f === 'waiting' && o.courier) return false;
      if (f === 'enroute' && o.status !== 'enroute') return false;
      if (f === 'risk' && !isRisk(o)) return false;
      if (state.courier && o.courier !== state.courier) return false;
      if (q) {
        const c = o.courier ? courier(o.courier).name : '';
        if (!(String(o.id).includes(q.replace(/[№\s]/g, '')) && /\d/.test(q)) && !(o.addr + ' ' + o.from + ' ' + c).toLowerCase().includes(q)) return false;
      }
      return true;
    }).sort((a, b) => a.promiseAt - b.promiseAt);
  }
  const rows = new Map();
  function buildRow(o) {
    const tr = document.createElement('tr');
    tr.className = 'row';
    tr.dataset.oid = o.id;
    tr.innerHTML = `<td class="td-id"></td><td class="td-addr"></td><td class="td-courier"></td><td class="td-status"></td>
      <td class="td-time"><span class="time"><span class="time__val"><span class="ic"></span><span class="roll"></span></span><span class="time__sub"><span class="due num"></span><span class="bar" aria-hidden="true"><i></i></span></span></span></td>`;
    return tr;
  }
  function fillRow(tr, o) {
    const c = o.courier ? courier(o.courier) : null;
    const late = isLate(o), risk = isRisk(o);
    tr.classList.toggle('is-late', late); tr.classList.toggle('is-risk', risk && !late);
    const key = [o.courier, o.status, o.addr].join('|');
    if (tr._key !== key) {
      tr._key = key;
      tr.children[0].innerHTML = `<span class="cell-main num">№${NB}${o.id}</span><span class="cell-sub num">с ${hhmm(o.createdAt)}</span>`;
      tr.children[1].innerHTML = `<span class="cell-main" title="${esc(o.addr)}">${esc(o.addr)}</span><span class="cell-sub" title="${esc(o.from)}">${esc(o.from)}</span>`;
      tr.children[2].innerHTML = c
        ? `<span class="cell-main">${esc(c.short)}</span><span class="cell-sub">${courierState(c) === 'off' ? '<span class="t-danger">нет связи</span>' : ordersOf(c).length + NB + plural(ordersOf(c).length, 'заказ', 'заказа', 'заказов') + ' на руках'}</span>`
        : `<button class="btn btn--sm btn--ghost ui-press ui-press--on-dark ui-focus" data-act="reassign" data-order="${o.id}">${icon('user-plus', 'icon--sm')}<span>Назначить</span></button>`;
      const [label, ic, cls] = STATUS[o.status];
      tr.children[3].innerHTML = `<span class="status">${icon(ic, cls)}<span>${label}</span></span>`;
    }
    const val = tr.querySelector('.time__val');
    val.className = 'time__val ' + (late ? 't-danger' : risk ? 't-warning' : '');
    const icKey = late ? 'alert' : risk ? 'clock' : '';
    const icEl = val.querySelector('.ic');
    if (icEl.dataset.k !== icKey) { icEl.dataset.k = icKey; icEl.innerHTML = icKey ? icon(icKey) : ''; icEl.style.display = icKey ? 'inline-flex' : 'none'; }
    roll(val.querySelector('.roll'), timeText(o));
    tr.querySelector('.due').textContent = 'к ' + hhmm(o.promiseAt);
    const p = Math.min(1, Math.max(0, (Date.now() - o.createdAt) / (o.promiseAt - o.createdAt)));
    tr.querySelector('.bar > i').style.setProperty('--p', late ? 1 : p.toFixed(3));
  }
  function renderOrders() {
    const body = $('#order-rows');
    const list = visibleOrders();
    $('[data-count="orders"]').textContent = list.length === state.orders.length ? list.length : `${list.length} из ${state.orders.length}`;
    // FLIP: remember positions
    const before = new Map();
    rows.forEach((tr, id) => { if (tr.isConnected) before.set(id, tr.getBoundingClientRect().top); });
    body.querySelector('.empty-row')?.remove();
    const keep = new Set(list.map(o => o.id));
    rows.forEach((tr, id) => { if (!keep.has(id)) tr.remove(); });
    list.forEach(o => {
      let tr = rows.get(o.id);
      if (!tr) { tr = buildRow(o); rows.set(o.id, tr); }
      fillRow(tr, o);
      body.appendChild(tr);
    });
    if (!list.length) {
      const q = state.query.trim();
      const why = q ? `Нет заказов по запросу «${esc(q)}»` : 'В этом фильтре заказов нет';
      body.insertAdjacentHTML('beforeend', `<tr class="empty-row"><td colspan="5"><span class="empty-in">${why}<button class="btn btn--sm btn--ghost ui-press ui-press--on-dark ui-focus" data-act="reset">Показать все заказы</button></span></td></tr>`);
    }
    if (!reduce.matches) list.forEach(o => {
      const tr = rows.get(o.id), b = before.get(o.id);
      if (b == null || !tr.animate) return;
      const d = b - tr.getBoundingClientRect().top;
      if (Math.abs(d) > 1 && window.innerWidth >= 720) tr.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(0.28, 0.11, 0.32, 1)' });
    });
    const chip = $('#courier-chip');
    if (state.courier) {
      chip.hidden = false;
      setHTML(chip, `<button class="btn btn--sm btn--ghost ui-press ui-press--on-dark ui-focus chip-filter" data-act="clear-courier" aria-label="Сбросить фильтр: курьер ${esc(courier(state.courier).short)}"><span>${esc(courier(state.courier).short)}</span>${icon('x', 'icon--sm')}</button>`);
    } else { chip.hidden = true; setHTML(chip, ''); }
  }
  function flashOrder(id) {
    const tr = rows.get(id); if (!tr) return;
    tr.classList.remove('is-flash'); void tr.offsetWidth; tr.classList.add('is-flash');
  }

  /* ── Couriers ──────────────────────────────────────────────────────────────────── */
  const C_STATE = {
    free: ['Свободен', 'check-circle', 'is-free'],
    pickup: ['Забирает заказ', 'package', ''],
    enroute: ['В пути', 'bike', ''],
    off: ['Нет связи', 'wifi-off', 'is-off'],
    break: ['Перерыв', 'coffee', '']
  };
  function renderCouriers() {
    const rank = { off: 0, free: 1, pickup: 2, enroute: 3, break: 4 };
    const list = state.couriers.filter(c => {
      const s = courierState(c);
      if (state.cFilter === 1) return s === 'free';
      if (state.cFilter === 2) return s === 'pickup' || s === 'enroute';
      return true;
    }).sort((a, b) => rank[courierState(a)] - rank[courierState(b)] || a.name.localeCompare(b.name, 'ru'));
    $('[data-count="couriers"]').textContent = state.couriers.length;
    const ul = $('#courier-list');
    const focused = ul.contains(document.activeElement) ? document.activeElement.dataset.cid : null;
    queueMicrotask(() => { if (focused) ul.querySelector(`[data-cid="${focused}"]`)?.focus({ preventScroll: true }); });
    if (!list.length) { setHTML(ul, `<li class="empty">${state.cFilter === 1 ? 'Свободных курьеров сейчас нет' : 'Никого в этом фильтре'}</li>`); return; }
    patchList(ul, list.map(c => {
      const s = courierState(c), [label, ic, cls] = C_STATE[s], mine = ordersOf(c);
      let meta = label;
      if (s === 'off') meta = `Нет связи ${Math.max(1, Math.round((Date.now() - c.offlineSince) / MIN))}${NB}мин`;
      if (s === 'break') meta = `Перерыв до ${hhmm(c.breakUntil)}`;
      if (s === 'enroute' || s === 'pickup') meta += ` · №${NB}` + mine.map(o => o.id).join(', №' + NB);
      const load = mine.length ? `${mine.length}${NB}${plural(mine.length, 'заказ', 'заказа', 'заказов')}` : '';
      return [c.id, `<button data-ui-align="start" class="courier ${cls} ui-press ui-press--surface ui-press--on-dark ui-focus" data-act="courier" data-cid="${c.id}" aria-pressed="${state.courier === c.id}"
        aria-label="${esc(c.name)}, ${esc(meta)}. Показать заказы курьера">
        ${icon(ic)}<span><span class="courier__name">${esc(c.name)}</span><span class="courier__meta">${esc(meta)}</span></span><span class="courier__load">${load}</span></button>`];
    }));
  }
  // DOM stays put when nothing changed: focus, hover and press survive the minute ticks.
  function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; el._items = null; } }
  function patchList(ul, items) {
    const old = ul._items || new Map(), next = new Map();
    if (!ul._items) { ul.innerHTML = ''; ul._html = null; }
    items.forEach(([key, html]) => {
      let li = old.get(key);
      if (!li) { li = document.createElement('li'); li.innerHTML = html; li._html = html; }
      else if (li._html !== html) {
        // Same courier, new text: update the existing button in place so it keeps focus and press state.
        const t = document.createElement('template'); t.innerHTML = html;
        const nb = t.content.firstElementChild, ob = li.firstElementChild;
        [...nb.attributes].forEach(a => ob.setAttribute(a.name, a.value));
        ob.innerHTML = nb.innerHTML; li._html = html;
      }
      next.set(key, li); ul.appendChild(li);
    });
    old.forEach((li, k) => { if (!next.has(k)) li.remove(); });
    ul._items = next;
  }

  function renderAll() { renderSummary(); renderProblems(); renderOrders(); renderCouriers(); }

  /* ── Toast with undo ───────────────────────────────────────────────────────────── */
  function toast(text, undo) {
    const box = $('#toasts');
    box.querySelectorAll('.toast').forEach(dismiss);
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `${icon('check-circle')}<span>${esc(text)}</span>` + (undo ? `<button class="btn btn--sm btn--quiet ui-press ui-press--on-dark ui-focus" type="button">Отменить</button>` : '');
    box.appendChild(t);
    let timer, done = false;
    const arm = () => { clearTimeout(timer); timer = setTimeout(() => dismiss(t), 6000); };
    t.addEventListener('pointerenter', () => clearTimeout(timer));
    t.addEventListener('pointerleave', arm);
    t.addEventListener('focusin', () => clearTimeout(timer));
    t.addEventListener('focusout', arm);
    if (undo) t.querySelector('button').addEventListener('click', () => { if (done) return; done = true; undo(); dismiss(t); });
    arm();
  }
  function dismiss(t) {
    if (t.dataset.leaving != null) return;
    t.dataset.leaving = '';
    setTimeout(() => t.remove(), 220);
  }

  /* ── Actions ───────────────────────────────────────────────────────────────────── */
  function collapse(el, then) {
    if (!el || reduce.matches || !el.animate) { then(); return; }
    const h = el.offsetHeight;
    el.style.overflow = 'hidden';
    el.animate([{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' }], { duration: 220, easing: 'cubic-bezier(0.3, 0, 1, 1)', fill: 'forwards' }).onfinish = then;
  }
  function resolve(pid) {
    const i = state.problems.findIndex(p => p.id === pid); if (i < 0) return;
    const p = state.problems[i];
    const li = document.querySelector(`[data-pid="${pid}"]`);
    const label = problemView(p).title;
    collapse(li, () => {
      state.problems.splice(i, 1);
      renderProblems();
      $('#problem-list').querySelector('button')?.focus({ preventScroll: true });
      toast(`Закрыто: ${label}`, () => { state.problems.splice(Math.min(i, state.problems.length), 0, p); renderProblems(p.id); });
    });
  }
  function extend(oid) {
    const o = order(oid), prev = o.promiseAt;
    o.promiseAt += 15 * MIN;
    renderAll(); flashOrder(oid);
    toast(`№${NB}${oid}: новый срок ${hhmm(o.promiseAt)}`, () => { o.promiseAt = prev; renderAll(); flashOrder(oid); });
  }

  // Assign dialog
  const dlg = $('#assign');
  let assignFor = null, assignTrigger = null;
  function openAssign(oid, trigger) {
    const o = order(oid); assignFor = o; assignTrigger = trigger;
    const cur = o.courier ? courier(o.courier).short : null;
    $('#assign-title').textContent = `Назначить курьера на №${NB}${o.id}`;
    $('#assign-sub').textContent = `${o.from} → ${o.addr}` + (cur ? ` · сейчас: ${cur}` : '');
    const cands = state.couriers.filter(c => c.id !== o.courier && ['free', 'pickup', 'enroute'].includes(courierState(c)) && ordersOf(c).length < 3)
      .sort((a, b) => ordersOf(a).length - ordersOf(b).length || a.dist - b.dist);
    const box = $('#assign-options');
    if (!cands.length) {
      box.innerHTML = '<p class="assign__none">Свободных курьеров рядом нет. Все на линии везут по 3 заказа.</p>';
      $('#assign-ok').disabled = true;
    } else {
      $('#assign-ok').disabled = false;
      box.innerHTML = cands.map((c, i) => {
        const n = ordersOf(c).length;
        return `<label class="pick"><input type="radio" name="courier" value="${c.id}" ${i === 0 ? 'checked' : ''}>
          <span><span>${esc(c.name)}</span><span class="pick__meta">${n ? n + NB + plural(n, 'заказ', 'заказа', 'заказов') + ' на руках' : 'Свободен'}</span></span>
          <span class="pick__dist">${String(c.dist).replace('.', ',')}${NB}км</span></label>`;
      }).join('');

  }
  $('#assign-form').addEventListener('submit', e => {
    const pick = $('#assign-form').querySelector('input[name="courier"]:checked');
    if (!pick || !assignFor) { e.preventDefault(); BetterUI.shake($('#assign-options')); return; }
    const o = assignFor, prev = { courier: o.courier, status: o.status };
    o.courier = pick.value; o.status = 'pickup';
    const name = courier(pick.value).short;
    renderAll(); flashOrder(o.id);
    toast(`№${NB}${o.id} назначен: ${name}`, () => { o.courier = prev.courier; o.status = prev.status; renderAll(); flashOrder(o.id); });
  });
  dlg.addEventListener('close', () => {
    if (assignTrigger && assignTrigger.isConnected) assignTrigger.focus({ preventScroll: true });
    else {
      // The "Назначить" button is gone once a courier is set: land on the updated row itself.
      const tr = assignFor && rows.get(assignFor.id);
      if (tr) { tr.tabIndex = -1; (tr.querySelector('button') || tr).focus({ preventScroll: true }); }
    }
  });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'resolve') resolve(b.dataset.pid);
    else if (act === 'extend') extend(+b.dataset.order);
    else if (act === 'reassign') openAssign(+b.dataset.order, b);
    else if (act === 'assign-cancel') dlg.close();
    else if (act === 'reset') { state.query = ''; $('#q').value = ''; state.courier = null; orderSeg.select(0); }
    else if (act === 'clear-courier') { state.courier = null; renderOrders(); renderCouriers(); $('#order-filter button[aria-pressed="true"]').focus(); }
    else if (act === 'courier') {
      const id = b.dataset.cid;
      state.courier = state.courier === id ? null : id;
      renderOrders(); renderCouriers();
      document.querySelector(`[data-cid="${id}"]`)?.focus({ preventScroll: true });
      if (state.courier && window.innerWidth < 1100) $('#orders').scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
    }
  });

  const orderSeg = BetterUI.segmented($('#order-filter'), { onChange: i => { state.filter = i; renderOrders(); renderSummary(); } });
  const courierSeg = BetterUI.segmented($('#courier-filter'), { onChange: i => { state.cFilter = i; renderCouriers(); renderSummary(); } });
  document.querySelectorAll('.stat').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.stat;
    if (k === 'free') { courierSeg.select(courierSeg.index() === 1 ? 0 : 1); if (window.innerWidth < 1100) $('#couriers').scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth' }); return; }
    const i = ORDER_FILTERS.indexOf(k);
    orderSeg.select(state.filter === i && i !== 0 ? 0 : i);
  }));
  let qTimer;
  $('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.query = e.target.value; renderOrders(); }, 120); });

  /* ── Load (fixtures). ?delay=ms shows the skeleton; ?fail=1 shows the error path ── */
  const regions = ['#summary', '#problems', '#orders', '#couriers'].map(s => $(s));
  function setBusy(v) { regions.forEach(r => r.setAttribute('aria-busy', String(v))); }
  let failOnce = params.get('fail') === '1';
  function load() {
    setBusy(true);
    document.querySelectorAll('.error').forEach(e => e.remove());
    const delay = Math.min(10000, +params.get('delay') || 0);
    return new Promise((res, rej) => setTimeout(() => failOnce ? (failOnce = false, rej(new Error('timeout'))) : res(fixtures()), delay))
      .then(d => { Object.assign(state, d, { loaded: true }); setBusy(false); renderAll(); },
        () => {
          // One message for the whole shift, not one per region: the regions share one source.
          $('.main').hidden = true; $('.side').hidden = true;
          $('#summary').insertAdjacentHTML('afterend', `<div class="region error" role="alert">${icon('alert')}<span>Данные смены не загрузились: сервер не ответил.</span><button class="btn btn--sm btn--ghost ui-press ui-press--on-dark ui-focus" data-act="retry">${icon('retry', 'icon--sm')}<span>Повторить</span></button></div>`);
        });
  }
  document.addEventListener('click', e => { if (e.target.closest('[data-act="retry"]')) { $('.main').hidden = false; $('.side').hidden = false; load(); } });

  /* ── Clock and minute ticks ────────────────────────────────────────────────────── */
  let lastMin = -1;
  function tick() {
    const now = new Date();
    roll($('#clock'), hhmm(now));
    $('#clock').setAttribute('datetime', now.toISOString());
    const m = Math.floor(Date.now() / 15000);
    if (state.loaded && m !== lastMin) {
      if (lastMin !== -1) { renderSummary(); renderOrders(); renderCouriers(); updateProblemTimes(); }
      lastMin = m;
    }
  }
  function updateProblemTimes() {
    // keep focus and buttons intact: only rewrite text nodes
    state.problems.forEach(p => {
      const li = document.querySelector(`[data-pid="${p.id}"]`); const v = problemView(p); if (!li || !v) return;
      li.querySelector('.problem__title').textContent = v.title;
      li.querySelector('.problem__meta').textContent = `${v.meta} · ${Math.max(1, Math.round((Date.now() - p.raisedAt) / MIN))}${NB}мин назад`;
    });
  }
  BetterUI.init(document);
  tick(); setInterval(tick, 1000);
  load();

  // Files dropped by accident must not navigate away from the shift.
  ['dragover', 'drop'].forEach(t => window.addEventListener(t, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); }));
})();
</script>
</body>
</html>
